name: release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Builds a self-contained single-file
# binary for six runtime IDs in parallel, generates SHA256 checksums for all artefacts,
# and uploads the lot to a GitHub Release for that tag. install.sh / install.ps1 then
# pull the binaries from this release.

on:
  push:
    tags:
      - 'v*'
  # Manual fallback so we can dry-run the matrix without cutting a real tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v). Used only for workflow_dispatch.'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write   # needed by softprops/action-gh-release to create / update the release

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   archive: tar.gz, asset: zdt-linux-x64.tar.gz   }
          - { os: ubuntu-latest,  rid: linux-arm64, archive: tar.gz, asset: zdt-linux-arm64.tar.gz }
          - { os: windows-latest, rid: win-x64,     archive: zip,    asset: zdt-win-x64.zip        }
          - { os: windows-latest, rid: win-arm64,   archive: zip,    asset: zdt-win-arm64.zip      }
          - { os: macos-latest,   rid: osx-arm64,   archive: tar.gz, asset: zdt-osx-arm64.tar.gz   }
          - { os: macos-latest,   rid: osx-x64,     archive: tar.gz, asset: zdt-osx-x64.tar.gz     }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Tag pushes give us refs/tags/vX.Y.Z. Strip the leading "v".
          # workflow_dispatch passes its own version via inputs.version.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            ver="${tag#v}"
          else
            ver="${{ github.event.inputs.version }}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building version: $ver"

      - name: Publish self-contained single-file
        shell: bash
        run: |
          # PublishSingleFile bundles the runtime, our DLLs, and native libs into one exe.
          # IncludeNativeLibrariesForSelfExtract extracts native libs to a temp dir on first
          # run rather than embedding them as resources — required for Spectre.Console + a
          # few BCL natives that don't tolerate the bundled-resources path.
          # EnableCompressionInSingleFile uses Brotli to roughly halve the on-disk size.
          # No PublishTrimmed: we use System.Text.Json with anonymous types in many places
          # (LiteLLM, MCP, observers) and Spectre.Console reflection — trimming would break
          # those at runtime. AOT migration is a future phase.
          dotnet publish src/Zdtllm.Cli/Zdtllm.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/${{ matrix.rid }}

      - name: Package (tar.gz) — Linux + macOS
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          # Strip everything except the single executable. Self-contained single-file
          # publish drops a few side files (zdt.pdb is suppressed by DebugType=none, but
          # createdump and similar may appear on Linux). We tar only the binary itself.
          tar -czf "../../${{ matrix.asset }}" zdt
          cd ../..
          ls -lh "${{ matrix.asset }}"

      - name: Package (zip) — Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\${{ matrix.rid }}\zdt.exe" -DestinationPath "${{ matrix.asset }}" -Force
          Get-Item "${{ matrix.asset }}" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          # Same format as `sha256sum --tag` but stick with simple format for cross-platform
          # consumers (install.sh greps the binary name out of this file).
          sha256sum *.tar.gz *.zip > checksums.txt
          echo "----- checksums.txt -----"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          # On workflow_dispatch we don't have a tag — skip the release step in that case
          # by gating on event_name. Tag pushes flow through normally.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        if: github.event_name == 'push'
